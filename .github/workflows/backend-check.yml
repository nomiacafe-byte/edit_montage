name: Backend checks
on:
  workflow_dispatch:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-check.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-check.yml"
jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r backend/requirements.txt requests
      - name: Compile Python source
        run: python -m compileall -q backend
      - name: End-to-end render smoke test
        run: python backend/smoke_test.py
