name: Backend checks
on:
  workflow_dispatch:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-check.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-check.yml"
jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python source
        run: python -m compileall -q backend
      - name: Build render container
        run: docker build -t rafa-studio-api ./backend
      - name: End-to-end render smoke test
        run: |
          python -m pip install requests
          python backend/smoke_test.py

# Build and syntax checks run against the current backend source.

# Rebuild the container whenever the rendering pipeline changes.

# Validate delivery acknowledgement and TTL cleanup changes as well.
